seed: 0
device: auto
data:
  root: data/processed
  fractions: [0.8, 0.1, 0.1]
encoders:
  protein:
    model: facebook/esm2_t6_8M_UR50D
    revision: c731040fcd8d73dceaa04b0a8e6329b345b0f5df
    freeze: true
    cache: embeddings/protein
    chunk_size: 1000
  ligand:
    model: DeepChem/ChemBERTa-77M-MTR
    revision: 66b895cab8adebea0cb59a8effa66b2020f204ca
    freeze: true
    cache: embeddings/ligand
    max_length: 512
patches:
  window: 32
  radius: 8.0
  max_patches: 32
  k: 8
model:
  patch_dim: 256
  projection_hidden: 64
  dropout: 0.1
  n_qubits: 4
  quantum_layers: 2
  angle_encoding: RY
  head_hidden: [256, 64]
training:
  batch_size: 8
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 15
  min_delta: 0.00001
  scheduler: true
  gradient_clip: 5.0
  num_workers: 0
  output: runs
